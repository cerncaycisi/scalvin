version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # CodeQL init and analyze must move together; the pinning test requires
      # both steps to run the same commit.
      codeql-action:
        patterns:
          - "github/codeql-action*"
